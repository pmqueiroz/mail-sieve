name: Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to, e.g. v0.1.0
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      ARCHIVE: mail-sieve-${{ inputs.tag }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p mail-sieve --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp LICENSE README.md "dist/$ARCHIVE/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/mail-sieve.exe" "dist/$ARCHIVE/"
            (cd dist && 7z a -tzip "$ARCHIVE.zip" "$ARCHIVE" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/mail-sieve" "dist/$ARCHIVE/"
            tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          fi
          rm -r "dist/$ARCHIVE"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          bin="target/${{ matrix.target }}/release/mail-sieve"
          [[ "${{ matrix.target }}" == *windows* ]] && bin="$bin.exe"
          "$bin" --help >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum mail-sieve-* > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/mail-sieve-*
      - name: Attach to the release
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
