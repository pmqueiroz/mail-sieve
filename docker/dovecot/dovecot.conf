mail_home=/srv/mail/%Lu
mail_location=sdbox:~/Mail
mail_uid=1000
mail_gid=1000
first_valid_uid = 1000
last_valid_uid = 1000

protocols = imap
listen = *
log_path = /dev/stdout
auth_mechanisms = plain login
disable_plaintext_auth = no
ssl = no

passdb {
  driver = static
  args = password=pass
}

mail_plugins = $mail_plugins zlib
protocol imap {
  mail_plugins = $mail_plugins imap_zlib
  mail_max_userip_connections = 64
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
}

service imap-login {
  process_min_avail = 1
  client_limit = 1000
  service_count = 0
}
