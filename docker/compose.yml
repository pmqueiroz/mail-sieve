services:
  mail-sieve:
    build: ..
    image: mail-sieve:latest
    restart: unless-stopped
    ports:
      - "${MAIL_SIEVE_HOST_IP:-127.0.0.1}:${MAIL_SIEVE_PORT:-8080}:8080"
    volumes:
      - mail-sieve-data:/data
    environment:
      MAIL_SIEVE_PUBLIC_URL: "${MAIL_SIEVE_PUBLIC_URL:-http://localhost:${MAIL_SIEVE_PORT:-8080}}"

volumes:
  mail-sieve-data:
