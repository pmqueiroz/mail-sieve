[package]
name = "mail-sieve-unsub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["net"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
